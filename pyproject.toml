[project]
name = "firefly-micro"
version = "0.0.1"
description = "Firefly Python microservice shared primitives."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "lhdht" },
]
dependencies = [
  "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firefly"]
artifacts = ["src/firefly/micro/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
